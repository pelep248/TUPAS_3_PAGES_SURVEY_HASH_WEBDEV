<!doctype html>
<html>
  <head>
    <title>Page Title</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <h1>Philip's Bakeshop Survey</h1>

    Your name:
    <input id="name" type="text" />
    Your age:
    <input id="age" type="text" />
    Your Gender:
    <input id="gender" type="text" />
    Your Favorite Bread:
    <input id="fave_bread" type="text" />
    Your Fvorite Innings:
    <input id="innings" type="text" />

    <button
      type="button"
      onclick="
        clickButton(
          document.getElementById('name').value,
          document.getElementById('age').value,
          document.getElementById('gender').value,
          document.getElementById('fave_bread').value,
          document.getElementById('innings').value,
        )
      "
    >
      Click Me!
    </button>

    <script>
      const clickButton = (a, b, c, d, e) => {
        const postData = {
          name: a,
          age: b,
          gender: c,
          fave_bread: d,
          innings: e,
        };

        const data = {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(postData),
        };

        async function fetchData() {
          try {
            const response = await fetch(
              "http://127.0.0.1:8000/bakeshop",
              data,
            );
            const result = await response.json();
            console.log(result);
            if (result.status == "success") {
              alert("Success!");
            } else {
              throw new Error("Failed to fetch data");
            }
          } catch (error) {
            console.error("Error:", error);
          }
        }

        fetchData();
      };
    </script>
  </body>
</html>
